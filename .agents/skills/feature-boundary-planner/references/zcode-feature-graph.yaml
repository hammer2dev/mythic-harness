  - id: capability.workspace-two-level-navigation
    kind: capability
    label: Primary module rail and page-owned secondary navigation
    aliases:
      - two-level navigation
      - 两层导航
      - 一级栏
      - 二级栏
      - 设置两级导航
      - 模型网关
    codeSeeds:
      - file: packages/ui/src/app-shell/WorkspaceShellLayout.tsx
        symbol: WorkspaceShellLayout
    invariants:
      - The rail derives its business module from App.workspaceMainView and highlights settings from the existing settings tab. Clicking the active module expands the sidebar; selecting a business module from settings exits through the existing explicit-navigation marker.
      - Secondary navigation is rendered by each page through a portal, without copying business state to the shell.
      - SettingsPage portals its existing grouped categories into a dedicated shell slot; the shell keeps the workspace content mounted and inert while settings is foreground.
      - Scheduled tasks and saved workflows have independent primary entries and navigation history kinds; saved workflows retain global/project directories while viewing details.
      - Plugin marketplace secondary navigation contains public/personal discovery and management entries, with sources at the bottom; catalog category groups remain in the public page body, without a category menu.
      - Model gateway has model settings and usage statistics as secondary sections. Entering from another primary module selects model settings; clicking the current primary entry preserves the section and expands the sidebar. Navigation history restores the recorded section and workspace identity.
