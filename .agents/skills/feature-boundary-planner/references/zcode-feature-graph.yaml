# Maintainer contract: docs/skills/feature-boundary-graph.md
# Search aliases and IDs first; read only the relevant nodes and one-hop relationships.
schemaVersion: 1
graphId: zcode-feature-relationships
purpose:
  Curated source discovery seeds, not an exhaustive feature catalog or a product authority. Verify
  matched nodes and relationships against the current checkout.
rules:
  semanticExpansion:
    Load matched nodes and one meaningful semantic hop; expand only for unresolved owners
    or callers.
  driftPolicy:
    Report missing paths, symbols or changed semantics as graph-drift-candidate; do not infer
    product rules from reachability.
  stableIdPolicy:
    Keep existing IDs when the semantic boundary is unchanged; use aliases for terminology
    changes.
  persistencePolicy:
    Impact-only reports proposed graph changes. Planning or implementation may update
    verified entries within the requested scope.
  relationRanks:
    - must-inspect
    - should-inspect
    - conditional
    - invariant-only
    - evidence-only
