    invariants:
      - AutomationsSection owns scheduled/idle view and tab; SavedWorkflowsSection owns workflow selection and projects existing savedWorkflowStore inventory into the secondary navigation. PluginStorePage owns the selected browse or management page.
      - PluginStoreBrowsePage owns segment/query/detail and no category selection state; PluginsSection owns management scope and editor state. Browse and management mount exclusively to avoid conflicting inventory initialization.
      - useAppPanels owns sidebar visibility; narrow and wide navigation share this state.
      - The existing tab store owns settings activation and SettingsPage owns the selected category; settings shares shell sidebar visibility and width without introducing another owner.
      - App owns modelGatewayTarget; ModelGatewayPage renders it without a second section state. ModelProviderSection keeps its editor state and root Host services; usage statistics use the current workspace Host and retain existing error semantics.
