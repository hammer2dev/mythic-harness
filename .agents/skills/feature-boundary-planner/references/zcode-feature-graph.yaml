      - file: apps/zcode-cli/packages/adapters/src/language-service/jdk-store.ts
        symbol: JdkStore
      - file: apps/zcode-cli/packages/core/src/tool/handlers/java-runtime.ts
        symbol: javaRuntimeToolEntry
      - file: apps/zcode-cli/packages/core/src/runtime/user-intent-evidence.ts
        symbol: TurnUserIntentEvidence
    invariants:
      - User registrations are environment-wide candidates; project and build JVM selections require explicit scope. Tooling Java is separate, and no settings page or per-directory mandatory configuration is introduced.
      - Writes require current trusted user intent, preserve explicit deny and revalidate evidence in the handler. Model or hook text and replayed history cannot authorize configuration writes.
  - id: service.code-development-resources
    kind: service
    label: Targeted Java plugin resource preparation
    aliases:
      - bundled JDT LS
      - tooling Java
      - Java 随包资源
    codeSeeds:
      - file: apps/zcode-cli/packages/code-development-plugin/scripts/prepare-runtime.mjs
        symbol: prepareCodeDevelopmentRuntime
      - file: apps/zcode-cli/packages/code-development-plugin/scripts/prepare-runtime.mjs
        symbol: assertCodeDevelopmentTarget
    invariants:
      - Build-time preparation pins resource hashes and uses a host Java 25 compiler for the extension. Target resources are staged serially; application startup never downloads them.
      - Five platform targets have resource definitions; Windows ARM64 is explicitly unsupported. Resource definitions and Windows validation are not evidence of execution on untested targets.
